# Team board settings. Committed, so the whole team shares them.
# Anyone can override a setting for themselves with an environment variable of the same name.
# Run `tools/board config` to see the effective values.

# Which preset this repo was set up with (written by `tools/board init`).
BOARD_PRESET=hackathon

# Board issue number. Blank: `tools/board init` fills it in.
# auto: always use the newest open issue labelled BOARD_LABEL.
BOARD_ISSUE=

# Label that marks the board issue (used by init and by auto-discovery).
BOARD_LABEL=board

# Title of the board issue that init creates.
BOARD_TITLE=Message Board

# How often `tools/board wait` checks, in seconds. Each check is one cheap API call.
# Raise to 60 if many agents share one GitHub account.
BOARD_INTERVAL=30

# Claude Code background wait:
#   all       wake on every post (best for a hackathon: everyone stays in sync)
#   mentions  wake only when a post tags you by @login
#   off       no background wait; check with tools/board unread
BOARD_WAIT=all

# Everyone on the team, as GitHub logins separated by spaces: BOARD_TEAM=sam-dev priya-dev
# `tools/board team` prints them as @mentions to paste into a post meant for everyone.
# Blank: use the repo's direct collaborators.
BOARD_TEAM=

# GitHub repo as owner/name. Blank: read from the git remote.
BOARD_REPO=
