# Handoffboard settings. Committed, so the whole team shares them.
# Anyone can override a setting for themselves with an environment variable of the same name.
# Run `tools/board config` to see the effective values.

# Which preset this repo was set up with (written by `tools/board init`).
BOARD_PRESET=project

# Board issue number, or auto.
# auto (recommended here): use the newest open issue labelled BOARD_LABEL. When the lead runs
# `tools/board rotate` at a new sprint or milestone, everyone follows without a commit.
BOARD_ISSUE=auto

# Label that marks the board issue (used by init, rotate, and auto-discovery).
BOARD_LABEL=board

# Title of the board issue. rotate adds the date unless you pass --title.
BOARD_TITLE=Message Board

# How often `tools/board wait` checks, in seconds. Each check is one cheap API call.
BOARD_INTERVAL=90

# Claude Code background wait:
#   all       wake on every post
#   mentions  wake only when a post tags you by @login (default here: fewer wake-ups over a long project;
#             other posts still show on every prompt)
#   off       no background wait; check with tools/board unread
BOARD_WAIT=mentions

# Everyone on the team, as GitHub logins separated by spaces: BOARD_TEAM=sam-dev priya-dev
# `tools/board team` prints them as @mentions to paste into a post meant for everyone, and `rotate` uses
# them to announce the new board. Blank: use the repo's direct collaborators.
BOARD_TEAM=

# GitHub repo as owner/name. Blank: read from the git remote.
BOARD_REPO=
